name: CI & NuGet Upload

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.103'

      - name: Verify release pipeline
        run: bash scripts/verify-release.sh

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: out/*.nupkg
          if-no-files-found: error

  publish-requested-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.103'

      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: out

      - name: Resolve explicit release request
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          request_file="release/requested-version.txt"
          if [[ ! -f "$request_file" ]]; then
            echo "requested=false" >> "$GITHUB_OUTPUT"
            echo "No release request marker; nothing to publish."
            exit 0
          fi

          requested="$(tr -d '[:space:]' < "$request_file")"
          version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n1)"
          if [[ -z "$requested" || "$requested" != "$version" ]]; then
            echo "Release request/version mismatch: request=$requested SSOT=$version" >&2
            exit 1
          fi

          tag="v${version}"
          published_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq ".[] | select(.tag_name == \"${tag}\" and .draft == false) | .id" | head -n1)"
          if [[ -n "$published_id" ]]; then
            echo "requested=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already published; nothing to do."
            exit 0
          fi

          echo "requested=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify package, tag release commit, and create draft release
        if: steps.release.outputs.requested == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          package="out/loach.PureSharp.${VERSION}.nupkg"
          if [[ ! -f "$package" ]]; then
            echo "Expected package not found: $package" >&2
            exit 1
          fi

          nuspec_version="$(unzip -p "$package" '*.nuspec' | sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' | head -n1)"
          if [[ "$nuspec_version" != "$VERSION" ]]; then
            echo "Package/version mismatch: package=$nuspec_version SSOT=$VERSION" >&2
            exit 1
          fi

          # Draft releases are intentionally disposable. A previous failed attempt may have
          # created an untagged draft; remove any draft for this version before retrying.
          while IFS= read -r draft_id; do
            [[ -z "$draft_id" ]] && continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${draft_id}"
            echo "Removed stale draft release ${draft_id} for $TAG."
          done < <(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq ".[] | select(.tag_name == \"${TAG}\" and .draft == true) | .id")

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            tag_target="$(git rev-list -n 1 "$TAG")"
            if [[ "$tag_target" != "$GITHUB_SHA" ]]; then
              echo "Existing immutable tag $TAG points to $tag_target, not release commit $GITHUB_SHA." >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/${TAG}"
            echo "Created $TAG at $GITHUB_SHA after the release gate passed."
          fi

          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          tag_target="$(git rev-list -n 1 "$TAG")"
          if [[ "$tag_target" != "$GITHUB_SHA" ]]; then
            echo "Release tag $TAG points to $tag_target, not release commit $GITHUB_SHA." >&2
            exit 1
          fi

          args=(release create "$TAG" "$package" --verify-tag --generate-notes --draft --title "PureSharp $TAG")
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"

      - name: Push NuGet package
        if: steps.release.outputs.requested == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: dotnet nuget push "out/loach.PureSharp.${VERSION}.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Verify published package from NuGet.org
        if: steps.release.outputs.requested == 'true'
        run: bash scripts/verify-published-package.sh "${{ steps.release.outputs.version }}"

      - name: Publish GitHub Release
        if: steps.release.outputs.requested == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ steps.release.outputs.tag }}" --draft=false

  publish-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.103'

      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: out

      - name: Verify tag, SSOT and package versions match
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ -z "$version" || "$version" != "$tag_version" ]]; then
            echo "Tag/version mismatch: tag=$GITHUB_REF_NAME SSOT=$version" >&2
            exit 1
          fi
          package="out/loach.PureSharp.${version}.nupkg"
          if [[ ! -f "$package" ]]; then
            echo "Expected package not found: $package" >&2
            exit 1
          fi
          nuspec_version="$(unzip -p "$package" '*.nuspec' | sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' | head -n1)"
          if [[ "$nuspec_version" != "$version" ]]; then
            echo "Package/version mismatch: package=$nuspec_version SSOT=$version" >&2
            exit 1
          fi

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/*.nupkg --clobber
          else
            args=(release create "$tag" out/*.nupkg --verify-tag --generate-notes --draft --title "PureSharp $tag")
            if [[ "$tag" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}"
          fi

      - name: Push NuGet package
        run: dotnet nuget push "out/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Verify published package from NuGet.org
        run: bash scripts/verify-published-package.sh "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
